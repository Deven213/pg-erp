<title>PG ERP Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;600&family=Noto+Sans+Gujarati:wght@500;600&display=swap">
<style>
/* Layout: three columns — screen index | live phone | screen notes. Chrome follows viewer theme; the phone is the app's fixed light UI. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --fg:#0F1B2D; --muted:#5A6678; --line:#DDE3EC; --accent:#1E4FD8; --accent-soft:#E7EEFD; --frame:#0E1422;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --navy:#0F2A5C; --blue:#2457E6; --blue-50:#EDF2FE; --ink:#111A2B; --ink-2:#4A5568; --ink-3:#8C97A8;
  --app-bg:#F5F7FB; --card:#FFFFFF; --stroke:#E4E8F0;
  --green:#138A4A; --green-50:#E6F6EC; --amber:#B86E00; --amber-50:#FFF3DC; --red:#C8261B; --red-50:#FDEBE9; --slate-50:#EEF1F5; --violet:#5B3FC4; --violet-50:#EEEAFB;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0B111D; --surface:#121A29; --fg:#E7ECF4; --muted:#95A2B6; --line:#243047; --accent:#7B9DFF; --accent-soft:#1B2848; --frame:#000; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0B111D; --surface:#121A29; --fg:#E7ECF4; --muted:#95A2B6; --line:#243047; --accent:#7B9DFF; --accent-soft:#1B2848; --frame:#000; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr) 310px;gap:20px;max-width:1380px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:start}
.side,.info{background:var(--surface);border:1px solid var(--line);border-radius:16px;position:sticky;top:16px}
.side{display:flex;flex-direction:column;max-height:calc(100dvh - 32px);overflow:hidden}
.brand{padding:16px 16px 10px;display:grid;gap:2px}
.brand b{font-family:var(--display);font-size:18px}
.brand span{color:var(--muted);font-size:12.5px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 16px 12px}
.roles button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:8px 6px;cursor:pointer}
.roles button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.roles button:focus-visible,.idx button:focus-visible,.states button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.idxhead{padding:0 16px 8px;display:flex;gap:8px}
.idxhead input{flex:1;min-width:0;font:inherit;font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.idx{overflow-y:auto;padding:0 8px 16px;flex:1}
.idx h5{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px;display:flex;justify-content:space-between}
.idx button{display:flex;width:100%;text-align:left;gap:8px;font:inherit;font-size:13px;border:0;background:transparent;color:var(--fg);padding:6px 8px;border-radius:8px;cursor:pointer}
.idx button:hover{background:var(--accent-soft)}
.idx button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.idx button i{font-style:normal;font-size:10.5px;color:var(--muted);margin-left:auto;align-self:center;white-space:nowrap}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:420px;text-align:center}
.crumbs b{color:var(--fg)}
.device{position:relative;width:390px;max-width:100%;height:820px;border-radius:46px;border:11px solid var(--frame);background:#F5F7FB;overflow:hidden;box-shadow:0 30px 60px -30px rgba(15,27,45,.35)}
.info{padding:18px;display:grid;gap:14px}
.info h2{font-family:var(--display);font-size:20px;margin:0;line-height:1.25;text-wrap:balance}
.info .mod{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.info p{margin:0;color:var(--muted);font-size:13.5px}
.info h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.info ul{margin:0;padding-left:18px;font-size:13px;display:grid;gap:4px}
.states{display:flex;flex-wrap:wrap;gap:6px}
.states button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:99px;padding:5px 10px;cursor:pointer}
.states button.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.reset{font:inherit;font-size:12.5px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-align:left}
@media (max-width:1180px){.shell{grid-template-columns:280px minmax(0,1fr)}.info{grid-column:2;position:static}}
@media (max-width:780px){.shell{grid-template-columns:minmax(0,1fr)}.side,.info{position:static;max-height:none}.side{order:1}.stage{order:0}.info{grid-column:auto;order:2}.idx{max-height:360px}.device{height:min(820px,calc(100dvh - 90px));border-width:8px;border-radius:36px}}

/* ================= APP (inside phone) ================= */
.phone{position:absolute;inset:0;display:flex;flex-direction:column;font-family:var(--body);color:var(--ink);font-size:13.5px;line-height:1.4;background:var(--app-bg);color-scheme:light}
.phone *{-webkit-tap-highlight-color:transparent}
.sb{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:12px;font-weight:600;background:var(--app-bg)}
.sb.dk{background:var(--navy);color:#fff}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin}
.ab{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:6px 16px 10px;background:var(--app-bg)}
.ab h1{font-size:17px;font-weight:700;margin:0;line-height:1.25;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab .sub{font-size:11.5px;color:var(--ink-3);font-weight:500}
.ib{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--card);border:1px solid var(--stroke);position:relative;flex:none;color:var(--ink)}
.ib .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.pg{padding:2px 16px 24px;display:flex;flex-direction:column;gap:12px}
.foot{flex:none;padding:10px 16px 16px;background:var(--card);border-top:1px solid var(--stroke);display:flex;gap:8px}
.foot>*{flex:1}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:14px;height:14px}.ico.lg{width:24px;height:24px}.ico.xl{width:36px;height:36px}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:13px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.stack{display:grid;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.t-xs{font-size:10.5px}.t-s{font-size:11.5px}.t-m{font-size:13px}.t-l{font-size:16px}.t-xl{font-size:20px}.t-xxl{font-size:26px}
.w6{font-weight:600}.w7{font-weight:700}
.mut{color:var(--ink-2)}.mut2{color:var(--ink-3)}
.c-ok{color:var(--green)}.c-warn{color:var(--amber)}.c-err{color:var(--red)}.c-blue{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.lnk{color:var(--blue);font-weight:600;font-size:12px;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:12px;font:inherit;font-weight:600;font-size:14px;border:1px solid transparent;padding:0 14px;white-space:nowrap;cursor:pointer;width:100%}
.btn.p{background:var(--blue);color:#fff}
.btn.s{background:var(--card);color:var(--ink);border-color:var(--stroke)}
.btn.g{background:transparent;color:var(--blue);min-height:36px}
.btn.d{background:var(--red);color:#fff}
.btn.ok{background:var(--green);color:#fff}
.btn.wa{background:#1DA851;color:#fff}
.btn.sm{min-height:34px;font-size:12.5px;border-radius:10px;padding:0 12px;width:auto}
.btn.dis{background:#C9D3E6;color:#fff;pointer-events:none}
.fld{display:grid;gap:5px;min-width:0}
.fld>label,.flab{font-size:12px;font-weight:600;color:var(--ink-2)}
.inp{min-height:44px;border:1px solid var(--stroke);border-radius:11px;background:var(--card);display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0}
.inp:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.inp.err{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);padding:11px 0;width:100%}
.inp textarea{resize:none;min-height:80px;line-height:1.45}
.inp select{appearance:none;cursor:pointer}
.inp .pre{font-weight:600;padding-right:8px;border-right:1px solid var(--stroke);white-space:nowrap}
.inp.ro{background:var(--slate-50)}
.help{font-size:11px;color:var(--ink-3)}
.help.err{color:var(--red);display:flex;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--stroke);background:var(--card);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{font-size:10.5px;opacity:.75}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips.err .chip{border-color:var(--red)}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;line-height:1.2}
.b-ok{background:var(--green-50);color:var(--green)}.b-warn{background:var(--amber-50);color:var(--amber)}.b-err{background:var(--red-50);color:var(--red)}.b-info{background:var(--blue-50);color:var(--blue)}.b-mute{background:var(--slate-50);color:var(--ink-2)}.b-navy{background:var(--navy);color:#fff}.b-vio{background:var(--violet-50);color:var(--violet)}
.bn{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--stroke);padding:8px 4px 14px}
.bn button{display:grid;justify-items:center;gap:3px;font:inherit;font-size:10.5px;font-weight:600;color:var(--ink-3);background:none;border:0;cursor:pointer;padding:2px 0;position:relative}
.bn button.on{color:var(--blue)}
.bn button.on .ico{stroke-width:2.3}
.bn .cnt{position:absolute;top:-3px;left:calc(50% + 4px);background:var(--red);color:#fff;font-size:9px;border-radius:99px;padding:1px 5px}
.list{background:var(--card);border:1px solid var(--stroke);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--stroke);min-width:0}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0}
.li .tx>div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;flex:none;display:grid;gap:3px;justify-items:end}
[data-go],[data-act],[data-tab],[data-back]{cursor:pointer}
.li[data-go]:hover,.li[data-act]:hover{background:#FAFBFD}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;background:var(--blue-50);color:var(--blue)}
.tile{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sec b{font-size:14.5px}
.bar{height:7px;border-radius:9px;background:var(--slate-50);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--blue)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa>div{background:var(--card);border:1px solid var(--stroke);border-radius:13px;padding:11px 4px;display:grid;justify-items:center;gap:6px;font-size:11px;font-weight:600;text-align:center}
.qa .tile{width:34px;height:34px}
.scrim{position:absolute;inset:0;background:rgba(10,18,35,.45);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;z-index:21;padding:8px 16px 20px;display:grid;gap:12px;max-height:86%;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--stroke);justify-self:center}
.dialog{position:absolute;left:22px;right:22px;top:50%;transform:translateY(-50%);background:var(--card);border-radius:18px;padding:18px;z-index:21;display:grid;gap:12px}
.toast{position:absolute;left:14px;right:14px;bottom:96px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:8px;align-items:center;font-size:13px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}
.skel{background:linear-gradient(90deg,#E6EAF1 0%,#F2F4F8 50%,#E6EAF1 100%);border-radius:8px;background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.skel{animation:sh 1.3s linear infinite}@keyframes sh{to{background-position:-200% 0}}}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:40px 18px}
.empty .big{width:76px;height:76px;border-radius:22px;display:grid;place-items:center}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{height:50px;width:100%;text-align:center;border:1px solid var(--stroke);border-radius:11px;background:var(--card);font:inherit;font-size:20px;font-weight:700;color:var(--ink);outline:0}
.otp input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.otp.e input{border-color:var(--red);color:var(--red)}
.steps{display:flex;gap:4px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--stroke)}.steps i.on{background:var(--blue)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#E9EDF4;border-radius:11px;padding:3px;gap:3px}
.seg button{font:inherit;text-align:center;font-size:12px;font-weight:600;padding:7px 0;border-radius:9px;color:var(--ink-2);background:none;border:0;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--stroke);font-size:13px;font-weight:600;color:var(--ink-3);overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs button{font:inherit;background:none;border:0;color:inherit;padding:9px 0;white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
.toggle{width:40px;height:23px;border-radius:99px;background:#CFD6E2;position:relative;flex:none;cursor:pointer;border:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle.on{background:var(--blue)}.toggle.on::after{left:19px}
.radio{width:19px;height:19px;border-radius:50%;border:2px solid #C5CDDA;flex:none}
.radio.on{border:6px solid var(--blue)}
.cbx{width:19px;height:19px;border-radius:5px;border:2px solid #C5CDDA;flex:none;display:grid;place-items:center;color:#fff}
.cbx.on{background:var(--blue);border-color:var(--blue)}
.fab{position:absolute;right:16px;z-index:5;display:flex;align-items:center;gap:6px;height:50px;padding:0 18px;border-radius:16px;background:var(--blue);color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 20px rgba(36,87,230,.35);cursor:pointer;border:0;font-family:inherit}
.illus{border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(180deg,#CFE0F7 0%,#E7EFFA 72%,#D7DEE8 72%)}
.illus .ov{position:absolute;left:10px;bottom:10px;right:10px;display:flex;justify-content:space-between;gap:6px}
.map{height:110px;border-radius:12px;background:linear-gradient(90deg,transparent 47%,#fff 47%,#fff 52%,transparent 52%),linear-gradient(0deg,transparent 40%,#fff 40%,#fff 46%,transparent 46%),linear-gradient(35deg,transparent 60%,#FFF4CF 60%,#FFF4CF 65%,transparent 65%),#E3ECE4;position:relative;border:1px solid var(--stroke)}
.map .pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);color:var(--red)}
.bedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.bed{border-radius:11px;padding:8px 6px;display:grid;gap:3px;justify-items:center;text-align:center;font-size:11px;font-weight:600;border:1.5px solid transparent;cursor:pointer;min-height:66px;align-content:center}
.bed.Available{background:var(--green-50);color:var(--green);border-color:#BFE6CD}
.bed.Reserved{background:var(--blue-50);color:var(--blue);border-color:#C7D6FB}
.bed.Occupied{background:var(--navy);color:#fff}
.bed.Maintenance{background:var(--amber-50);color:var(--amber);border-color:#F2D9A6}
.bed.Inactive{background:var(--slate-50);color:var(--ink-3);border-style:dashed;border-color:#C5CDDA}
.bed.sel{outline:3px solid var(--blue);outline-offset:2px}
.bed.blk{opacity:.55}
.dotrow{display:flex;gap:3px;flex-wrap:wrap}
.dotrow i{width:11px;height:11px;border-radius:3px;display:block}
.d-Available{background:var(--green)}.d-Reserved{background:var(--blue)}.d-Occupied{background:var(--navy)}.d-Maintenance{background:var(--amber)}.d-Inactive{background:#C5CDDA}
.tl{display:grid;gap:0}
.tl>div{display:grid;grid-template-columns:22px 1fr;gap:8px;position:relative;padding-bottom:14px}
.tl>div:last-child{padding-bottom:0}
.tl>div::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--stroke)}
.tl>div:last-child::before{display:none}
.tl .dt{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--slate-50);color:var(--ink-3)}
.tl .dt.on{background:var(--blue);color:#fff}
.tl .dt.ok{background:var(--green);color:#fff}
.stepper{display:flex;align-items:flex-start}
.stepper>div{flex:1;display:grid;justify-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--ink-3);text-align:center;position:relative}
.stepper>div::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:2px;background:var(--stroke)}
.stepper>div:first-child::before{display:none}
.stepper>div.on{color:var(--ink)}
.stepper>div.on::before{background:var(--blue)}
.stepper i{width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--stroke);display:grid;place-items:center;position:relative;z-index:1}
.stepper .on i{background:var(--blue);border-color:var(--blue);color:#fff}
.upl{border:1.5px dashed #BFC9DA;border-radius:12px;padding:14px;display:grid;justify-items:center;gap:4px;text-align:center;color:var(--ink-2);font-size:12px;cursor:pointer;background:var(--card)}
.upl.done{border-style:solid;border-color:#BFE6CD;background:var(--green-50);color:var(--green)}
.ph{border-radius:10px;background:linear-gradient(135deg,#DCE4F1,#EEF2F8);display:grid;place-items:center;color:var(--ink-3);aspect-ratio:1;max-width:100%}
.doc{background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:16px;display:grid;gap:10px;font-size:12.5px}
.doc .hr{border-top:1px dashed var(--stroke)}
.kv{display:grid;gap:9px}
.kv>div{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.kv>div>span:first-child{color:var(--ink-2)}
.kv>div>span:last-child{font-weight:600;text-align:right}
.banner{border-radius:12px;padding:11px 12px;display:flex;gap:9px;align-items:flex-start;font-size:12.5px}
.banner.warn{background:var(--amber-50);color:#6E4300}
.banner.err{background:var(--red-50);color:#8A1A12}
.banner.info{background:var(--blue-50);color:#1B3E9E}
.banner.ok{background:var(--green-50);color:#0D5E33}
.offbar{background:var(--ink);color:#fff;font-size:11.5px;padding:7px 16px;display:flex;gap:6px;align-items:center}
.stars{display:flex;gap:6px;color:#E2A400}
.stars svg{width:30px;height:30px;cursor:pointer}
.stars .f{fill:#F5B800;stroke:#E2A400}
.chat{display:grid;gap:8px}
.chat .m{max-width:82%;padding:9px 11px;border-radius:12px;font-size:12.5px;background:var(--card);border:1px solid var(--stroke)}
.chat .m.me{justify-self:end;background:var(--blue-50);border-color:#CFDCFB}
.ind{font-family:"Noto Sans Devanagari",var(--body)}.guj{font-family:"Noto Sans Gujarati",var(--body)}
.mt{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10.5px}
.mt span{padding:6px 0;border-radius:6px;font-weight:600}
</style>
